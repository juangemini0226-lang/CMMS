{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>Seleccione Activo para la Familia: {{ familia.nombre }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.activo.label_tag }}
    {{ form.activo }}
    <button type="submit" class="btn btn-primary mt-3">Siguiente</button>
  </form>
</div>
{% endblock %}
