{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Seleccionar Reporte</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0">Seleccionar Tipo de Reporte</h4>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              {{ form.tipo_reporte.label_tag }}
              {{ form.tipo_reporte }}
            </div>

            <button type="submit" class="btn btn-danger">Generar Reporte</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
